# TT-PATCH: TT-902 -- tenstorrent addition (see PATCHES.md, TT-FORK.md).
#
# Daily, read-only look at tpretz/terraform-provider-zabbix: if it has
# released a v2.x.y newer than what our upstream-v2 mirror contains, open (or
# update) ONE tracking issue in THIS repository, labelled upstream-sync,
# pointing at the release and its CHANGELOG. Toward upstream this only reads
# public data; it never writes there. Acting on the issue is the
# sync-upstream skill (.claude/skills/sync-upstream/SKILL.md).
name: tt-upstream-watch

on:
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare tpretz releases with our upstream-v2 mirror
        id: cmp
        run: |
          set -euo pipefail
          git fetch --quiet --no-tags https://github.com/tpretz/terraform-provider-zabbix \
            '+refs/heads/v2:refs/remotes/tpretz/v2' '+refs/tags/*:refs/upstream-tags/*'
          git fetch --quiet origin '+refs/heads/upstream-v2:refs/remotes/origin/upstream-v2'
          mirror=$(git rev-parse refs/remotes/origin/upstream-v2)
          latest=$(git for-each-ref --sort=-v:refname --format='%(refname:strip=2)' 'refs/upstream-tags/v2.*' \
                   | grep -E '^v2\.[0-9]+\.[0-9]+$' | head -n1 || true)
          ahead=$(git rev-list --count "$mirror..refs/remotes/tpretz/v2")
          new=false
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "refs/upstream-tags/$latest" "$mirror"; then
            new=true
          fi
          {
            echo "latest=$latest"
            echo "ahead=$ahead"
            echo "mirror=$(git rev-parse --short "$mirror")"
            echo "new=$new"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Upstream watch"
            echo "- newest upstream release tag: \`${latest:-none}\`"
            echo "- our upstream-v2 mirror: \`$(git rev-parse --short "$mirror")\`"
            echo "- tpretz/v2 commits not yet in the mirror: $ahead"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: steps.cmp.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ steps.cmp.outputs.latest }}
          AHEAD: ${{ steps.cmp.outputs.ahead }}
          MIRROR: ${{ steps.cmp.outputs.mirror }}
        run: |
          set -euo pipefail
          title="Upstream tpretz $LATEST available"
          body=$(cat <<BODY
          tpretz/terraform-provider-zabbix has released **$LATEST**, which our \`upstream-v2\` mirror (\`$MIRROR\`) does not contain yet ($AHEAD commits on tpretz/v2 beyond the mirror).

          - Release: https://github.com/tpretz/terraform-provider-zabbix/releases/tag/$LATEST
          - Changelog: https://github.com/tpretz/terraform-provider-zabbix/blob/$LATEST/CHANGELOG.md
          - Migration notes: https://github.com/tpretz/terraform-provider-zabbix/blob/$LATEST/MIGRATING.md
          - Changes since our base: https://github.com/tpretz/terraform-provider-zabbix/compare/$MIRROR...$LATEST

          To act on it, run the \`sync-upstream\` skill (\`.claude/skills/sync-upstream/SKILL.md\`), or \`scripts/sync-upstream.sh --dry-run --upstream-ref $LATEST\` by hand. Do not open anything upstream.

          _Maintained by .github/workflows/tt-upstream-watch.yml; this issue is updated in place._
          BODY
          )
          if ! gh label create upstream-sync --color 0E8A16 \
                 --description "A newer tpretz upstream release is available" 2>/dev/null; then
            true  # already exists, or issues are disabled (the next call says which)
          fi
          existing=$(gh issue list --state open --label upstream-sync --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --title "$title" --body "$body"
          else
            gh issue create --title "$title" --label upstream-sync --body "$body"
          fi
