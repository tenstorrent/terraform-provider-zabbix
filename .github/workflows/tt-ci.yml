# TT-PATCH: TT-902 -- tenstorrent CI (see PATCHES.md, TT-FORK.md § Continuous integration).
#
# Upstream's ci.yml only builds and unit-tests (and its push trigger names a
# branch we do not have); upstream's nightly.yml runs acceptance on a schedule
# from the default branch only. This workflow gives every PR and every push to
# main / upstream-v2 the full gate: static checks, unit tests (including the
# schema/enum/coverage guards), docs drift, and the acceptance suite against
# real Zabbix 7.4, 7.0 and 6.0 using upstream's own compose stacks and
# Makefile targets, so nothing here has to track upstream's test harness.
name: tt-ci

on:
  pull_request:
  push:
    branches: [main, upstream-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tt-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: build, vet, fmt, unit, docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain pins
        run: make check-toolchain

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read the pinned Terraform version
        id: tfver
        run: echo "version=$(awk '$1=="terraform" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then echo "not gofmt'd:"; echo "$out"; exit 1; fi

      - name: Unit tests (schema, enum and coverage guards included)
        run: TF_ACC='' go test ./... -count=1

      - name: govulncheck (new findings extend TT-005; see PATCHES.md)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Generated docs are current
        run: make docs-check

      - name: shellcheck
        run: |
          if compgen -G "scripts/*.sh" >/dev/null; then shellcheck scripts/*.sh; fi

      - name: Patch hygiene (every tt commit names a manifest ID)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --quiet origin "$BASE" "$HEAD" --depth=500 || true
          ids=$(grep -oE '^\| *[0-9]+ *\| *TT-[0-9]+ *\|' PATCHES.md | grep -oE 'TT-[0-9]+' || true)
          rc=0
          while read -r sha subject; do
            [ -n "$sha" ] || continue
            case "$subject" in
              sync:*|Merge*) continue ;;
            esac
            id=$(sed -nE 's/^(fixup! )*tt: (TT-[0-9]+) .*/\2/p' <<<"$subject")
            if [ -z "$id" ]; then
              echo "::warning::$sha is not a 'tt: TT-NNN' or 'fixup! tt: TT-NNN' commit: $subject"
            elif ! grep -qx "$id" <<<"$ids"; then
              echo "::error::$sha names $id, which PATCHES.md does not list"; rc=1
            fi
          done < <(git log --no-merges --format='%H %s' "$BASE..$HEAD" 2>/dev/null)
          exit $rc

  acceptance:
    name: acceptance (zabbix ${{ matrix.label }})
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: "74", label: "7.4" }
          - { version: "70", label: "7.0 LTS" }
          - { version: "60", label: "6.0 LTS" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read the pinned Terraform version
        id: tfver
        run: echo "version=$(awk '$1=="terraform" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.tfver.outputs.version }}
          terraform_wrapper: false

      - name: Bring up the Zabbix ${{ matrix.label }} stack (upstream's docker-compose.test.yml)
        run: make testenv-up-${{ matrix.version }}

      - name: Acceptance tests
        run: make test${{ matrix.version }}

      - name: Stack diagnostics
        if: failure()
        run: |
          docker compose -f docker-compose.test.yml ps
          docker compose -f docker-compose.test.yml logs --no-color --tail=300 \
            zabbix-db-${{ matrix.version }} zabbix-server-${{ matrix.version }} zabbix-web-${{ matrix.version }}

      - name: Upload the acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tt-acc-${{ matrix.version }}
          path: provider/acc-${{ matrix.version }}.log
          if-no-files-found: ignore
          retention-days: 14
