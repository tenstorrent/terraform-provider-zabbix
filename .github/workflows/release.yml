# This GitHub action can publish assets for release when a tag is created.
# Currently its setup to run on any tag that matches the pattern "v*" (ie. v0.1.0).
#
# This uses an action (hashicorp/ghaction-import-gpg) that assumes you set your 
# private key in the `GPG_PRIVATE_KEY` secret and passphrase in the `PASSPHRASE`
# secret. If you would rather own your own GPG handling, please fork this action
# or use an alternative one for key handling.
#
# You will need to pass the `--batch` flag to `gpg` in your signing step 
# in `goreleaser` to indicate this is being used in a non-interactive mode.
#
name: release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      -
        name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.26"
      -
        name: Download Go modules
        run: go mod download
      -
        name: Import GPG key
        id: import_gpg
        run: |
          # Install required tools
          sudo apt-get update && sudo apt-get install -y gnupg

          # Create temporary GPG directory
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg
          
          # Import GPG private key from secret (base64 decoded) and capture output
          IMPORT_OUTPUT=$(echo "${{ secrets.GPG_PRIVATE_KEY_BASE64 }}" | base64 -d | gpg --batch --import 2>&1)
          
          # Show the import output
          echo "$IMPORT_OUTPUT"
          
          # Extract key ID from import output
          GPG_FINGERPRINT=$(echo "$IMPORT_OUTPUT" | grep -o "key [A-F0-9]\{16\}" | head -1 | cut -d' ' -f2)
          echo "GPG Fingerprint extracted: $GPG_FINGERPRINT"
          
          # Export as environment variable for later steps
          echo "GPG_FINGERPRINT=$GPG_FINGERPRINT" >> $GITHUB_ENV
          
          # Set up GPG for non-interactive signing
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye
      -
        name: Debug - Print GPG fingerprint
        run: |
          echo "GPG Fingerprint from environment: $GPG_FINGERPRINT"
          echo "This is what will be passed to GoReleaser"
      -
        name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: 2.9.0
          args: release --clean --verbose
        env:
          # GPG_FINGERPRINT is now directly available from GITHUB_ENV
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
